<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 云隐修仙录 · 应用图标(矢量源文件,由 scripts/gen-pwa-icons.mjs 光栅化为 PNG) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF7EC"/>
      <stop offset="1" stop-color="#EBE2CE"/>
    </linearGradient>
  </defs>

  <!-- 羊皮纸底 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- 细描边 -->
  <rect x="40" y="40" width="432" height="432" rx="72" fill="none" stroke="#D8CDB4" stroke-width="6"/>

  <!-- 暖朱朝阳(山后升起) -->
  <circle cx="256" cy="200" r="78" fill="#C2542B"/>
  <circle cx="256" cy="200" r="78" fill="none" stroke="#A64422" stroke-width="6" opacity="0.45"/>

  <!-- 墨色山峦 -->
  <path d="M24 396 L208 216 L252 262 L308 190 L488 396 L488 496 L24 496 Z" fill="#4A3B2E"/>
  <path d="M24 396 L208 216 L252 262 L308 190 L356 310 L300 396 Z" fill="#3A2E22" opacity="0.55"/>

  <!-- 山前云带 -->
  <g fill="#FFFFFF" opacity="0.94">
    <ellipse cx="148" cy="408" rx="104" ry="34"/>
    <ellipse cx="258" cy="394" rx="120" ry="40"/>
    <ellipse cx="376" cy="414" rx="96" ry="30"/>
    <ellipse cx="210" cy="430" rx="90" ry="24"/>
    <ellipse cx="330" cy="434" rx="80" ry="22"/>
  </g>
</svg>
