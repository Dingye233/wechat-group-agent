<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06120f">
<link rel="manifest" href="/rpg/manifest.json">
<title>问道 · 文字修仙</title>
<style>
  :root{ --gold:#e8c06a; --jade:#6ee7b7; --line:#1e3a2d; --dim:#8fa89a; --blood:#e2654f; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{color:#e7f0e8;font:15px/1.65 "Noto Serif SC","Songti SC",Georgia,"Microsoft YaHei",serif;
    background:
      radial-gradient(1100px 520px at 12% -10%, #14352a 0%, transparent 62%),
      radial-gradient(800px 420px at 92% 0%, #16283f 0%, transparent 58%),
      linear-gradient(180deg,#07130f,#06100c 60%,#040a08);
    padding:14px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .wrap{max-width:1120px;margin:0 auto;display:grid;gap:12px;grid-template-columns:1.15fr .85fr}
  @media (max-width:880px){ .wrap{grid-template-columns:1fr} }
  .card{background:linear-gradient(180deg,#ffffff08,#ffffff03);border:1px solid var(--line);border-radius:16px;padding:14px}
  .title{font-size:18px;color:var(--gold);letter-spacing:.12em;display:flex;align-items:center;gap:8px}
  .title small{color:var(--dim);font-size:12px;letter-spacing:0}
  .muted{color:var(--dim);font-size:13px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar{height:10px;border-radius:99px;background:#08150f;border:1px solid var(--line);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34a97c,#8ff0c3);transition:width .3s}
  .grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
  .stat{background:#0a1a14;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .stat span{color:var(--dim);font-size:12px;display:block}
  .stat b{color:var(--gold);font-size:16px}
  .scenes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .scene{border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#0a1a14;cursor:pointer;transition:.15s}
  .scene.on{border-color:#3d8a66;background:linear-gradient(180deg,#173e2e,#0d2419)}
  .scene b{color:#cfeee0;font-size:14px}
  .scene p{margin:2px 0 0;color:var(--dim);font-size:12px}
  .acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
  .btn{appearance:none;border:1px solid #2b5644;background:linear-gradient(180deg,#173a2c,#0f261d);
    color:#e7f0e8;padding:10px 12px;border-radius:12px;font:inherit;cursor:pointer;transition:.15s}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,#2a6b4f,#194734);border-color:#3d8a66}
  .btn.gold{background:linear-gradient(180deg,#7a5c20,#4d3a12);border-color:#a58333;color:#ffe9b0}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .log{height:min(38vh,300px);overflow:auto;background:#07120d;border:1px solid var(--line);border-radius:12px;
    padding:10px;font-size:14px;white-space:pre-wrap}
  .log .sys{color:var(--dim)}
  .log .good{color:var(--jade)}
  .log .bad{color:var(--blood)}
  .log .gold{color:var(--gold)}
  .chat{height:170px;overflow:auto;font-size:14px}
  .chat p{margin:0 0 4px}
  .chat .who{color:var(--jade)}
  .online{display:flex;flex-wrap:wrap;gap:6px}
  .pill{border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:12px;color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td{padding:5px 4px;border-bottom:1px dashed #17322a}
  td.r{text-align:right;color:var(--dim)}
  input{font-family:inherit;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#081511;color:#e7f0e8}
  .screen{position:fixed;inset:0;display:grid;place-items:center;background:#040b08f2;z-index:20;padding:16px}
  .panel{width:min(420px,92vw);background:#0a1a14ee;border:1px solid #24473a;border-radius:18px;padding:20px;text-align:center}
  .panel h1{font-size:28px;letter-spacing:.4em;color:var(--gold);margin:0 0 4px}
  .hidden{display:none!important}
  #toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(12px);
    background:#0c2119f2;border:1px solid #2f6a52;color:#d9ffee;padding:9px 15px;border-radius:99px;font-size:13.5px;
    opacity:0;transition:.22s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap">
  <main style="display:grid;gap:12px">
    <section class="card">
      <div class="title">☯ <span id="whoami">道友</span> <small id="realmTag">练气初期</small></div>
      <div class="row" style="margin:10px 0 4px">
        <span class="muted">修为</span>
        <div class="bar"><i id="expBar"></i></div>
        <span class="muted" id="expText">0 / 90</span>
      </div>
      <div class="muted" id="rootDesc">灵根：—</div>
      <div class="grid" style="margin-top:10px">
        <div class="stat"><span>悟性</span><b id="s-comp">-</b></div>
        <div class="stat"><span>气运</span><b id="s-luck">-</b></div>
        <div class="stat"><span>寿元</span><b id="s-life">-</b></div>
        <div class="stat"><span>灵石</span><b id="s-stone">-</b></div>
        <div class="stat"><span>灵草</span><b id="s-herb">-</b></div>
        <div class="stat"><span>灵矿</span><b id="s-ore">-</b></div>
        <div class="stat"><span>丹药</span><b id="s-pill">-</b></div>
        <div class="stat"><span>飞剑 / 法袍</span><b id="s-gear">-</b></div>
      </div>
    </section>

    <section class="card">
      <div class="title" style="font-size:16px">🗺 去处</div>
      <div class="scenes" id="scenes" style="margin-top:8px"></div>
    </section>

    <section class="card">
      <div class="title" style="font-size:16px">🌀 行动</div>
      <div class="acts" id="acts" style="margin-top:8px"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn gold" id="btnBreak">突破境界</button>
        <span class="muted" id="breakHint"></span>
      </div>
    </section>

    <section class="card">
      <div class="title" style="font-size:16px">📜 见闻</div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <aside style="display:grid;gap:12px;align-content:start">
    <section class="card">
      <div class="title" style="font-size:16px">👥 在线道友</div>
      <div class="online" id="online" style="margin-top:8px"></div>
      <div class="title" style="font-size:16px;margin-top:14px">🏯 天骄榜</div>
      <table id="board"></table>
    </section>
    <section class="card">
      <div class="title" style="font-size:16px">💬 传音</div>
      <div class="chat" id="chat"></div>
      <div class="row" style="margin-top:8px">
        <input id="chatInput" maxlength="100" placeholder="说点什么…" style="flex:1;min-width:120px">
        <button class="btn" id="chatSend">传音</button>
      </div>
    </section>
  </aside>
</div>

<div class="screen" id="login">
  <div class="panel">
    <h1>问道</h1>
    <p class="muted">文字修仙 · 打坐、采药、炼丹、炼器、历练、渡劫</p>
    <input id="nameInput" maxlength="16" placeholder="输入道号" style="width:100%;margin:12px 0;text-align:center">
    <button class="btn primary" id="enterBtn" style="width:100%">踏入修行界</button>
    <p class="muted" id="loginHint">离线也在修炼，回来有收益</p>
  </div>
</div>

<div class="screen hidden" id="notice">
  <div class="panel">
    <h1 style="font-size:22px;letter-spacing:.2em">境界</h1>
    <p id="noticeText" style="color:#cfe6da"></p>
    <button class="btn primary" id="noticeOk" style="width:100%;margin-top:12px">知道了</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const S = { name: '', state: null, scene: 'cave', ws: null, busy: false };

  const ACTIONS = {
    cave: [['meditate', '🧘 打坐', 'primary'], ['seclude', '🕯 闭关', '']],
    valley: [['gather', '🌿 采灵草', 'primary']],
    furnace: [['alchemy', '⚗️ 炼丹', 'primary'], ['use_pill', '💊 服丹', '']],
    forge: [['mine', '⛏ 挖灵矿', 'primary'], ['forge', '🔨 炼器', '']],
    abyss: [['train', '🗡 历练', 'primary']],
    tower: [['sect', '📜 宗门任务', 'primary']],
  };

  function toast(text) {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 1900);
  }
  function log(text, cls = 'sys') {
    const box = $('log');
    const div = document.createElement('div');
    div.className = cls;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    while (box.children.length > 260) box.removeChild(box.firstChild);
  }
  async function api(path, options) {
    const res = await fetch(path, options);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || '请求失败');
    return data;
  }

  function render(st) {
    if (!st) return;
    S.state = st;
    $('whoami').textContent = st.name;
    $('realmTag').textContent = st.realm_name + st.sub_name;
    $('expBar').style.width = Math.min(100, Math.round(st.exp / Math.max(1, st.exp_need) * 100)) + '%';
    $('expText').textContent = `${st.exp} / ${st.exp_need}`;
    $('rootDesc').textContent = `灵根：${st.root_name} · ${st.root_desc}　攻 ${st.atk} / 防 ${st.def}`;
    $('s-comp').textContent = st.comp;
    $('s-luck').textContent = st.luck;
    $('s-life').textContent = st.lifespan;
    $('s-stone').textContent = st.stones;
    $('s-herb').textContent = st.herbs;
    $('s-ore').textContent = st.ores;
    $('s-pill').textContent = st.pills;
    $('s-gear').textContent = `${st.weapon_lv} / ${st.robe_lv}`;
    $('breakHint').textContent = st.exp >= st.exp_need
      ? (st.sub >= 2 ? '修为已满，可渡劫冲击大境界' : '修为已满，可以突破小境界')
      : `还需 ${st.exp_need - st.exp} 修为`;
  }

  function renderScenes(list) {
    const box = $('scenes');
    box.innerHTML = '';
    (list || []).forEach((sc) => {
      const el = document.createElement('div');
      el.className = 'scene' + (sc.key === S.scene ? ' on' : '');
      const b = document.createElement('b');
      b.textContent = sc.name;
      const p = document.createElement('p');
      p.textContent = sc.desc;
      el.append(b, p);
      el.addEventListener('click', () => {
        S.scene = sc.key;
        document.querySelectorAll('.scene').forEach((n) => n.classList.remove('on'));
        el.classList.add('on');
        renderActions();
        log(`你来到了 ${sc.name}。`);
      });
      box.appendChild(el);
    });
    renderActions();
  }
  function renderActions() {
    const box = $('acts');
    box.innerHTML = '';
    (ACTIONS[S.scene] || []).forEach(([key, label, cls]) => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + cls;
      btn.textContent = label;
      btn.addEventListener('click', () => doAction(key, btn));
      box.appendChild(btn);
    });
  }

  async function doAction(action, btn) {
    if (S.busy) return;
    S.busy = true;
    if (btn) btn.disabled = true;
    try {
      const data = await api('/api/rpg/c/action', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: S.name, action }),
      });
      if (data.state) render(data.state);
      if (data.message) log(data.message, data.ok ? 'good' : 'sys');
      if (!data.ok) toast(data.message);
    } catch (err) {
      toast(err.message);
    } finally {
      S.busy = false;
      if (btn) btn.disabled = false;
    }
  }

  async function breakthrough() {
    if (S.busy) return;
    S.busy = true;
    try {
      const data = await api('/api/rpg/c/breakthrough', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: S.name }),
      });
      if (data.state) render(data.state);
      if (data.message) {
        log(data.message, data.ok ? 'gold' : 'sys');
        showNotice(data.message);
      }
    } catch (err) { toast(err.message); }
    finally { S.busy = false; }
  }
  function showNotice(text) {
    $('noticeText').textContent = text;
    $('notice').classList.remove('hidden');
  }

  async function enter() {
    const name = ($('nameInput').value || '').trim();
    if (!name) { $('loginHint').textContent = '先取个道号'; return; }
    try {
      const data = await api('/api/rpg/c/join', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      S.name = name;
      localStorage.setItem('cultivate.name', name);
      $('login').classList.add('hidden');
      render(data.state);
      renderScenes(data.scenes);
      log(`🌫 ${name} 踏入修行界，灵根：${data.state.root_name}。`);
      connect();
      refreshBoard();
      const off = await api('/api/rpg/c/offline', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name }),
      }).catch(() => null);
      if (off && off.exp > 0) {
        render(off.state);
        log(`🕯 离线 ${(off.seconds / 3600).toFixed(1)} 小时，自动打坐修为 +${off.exp}，灵石 +${off.stones}`, 'gold');
        toast(`离线收益：修为 +${off.exp}`);
      }
    } catch (err) {
      $('loginHint').textContent = err.message;
    }
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/api/rpg/ws?name=${encodeURIComponent(S.name)}`);
    S.ws = ws;
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.type === 'chat') {
        const p = document.createElement('p');
        const who = document.createElement('span'); who.className = 'who'; who.textContent = m.name + '：';
        const msg = document.createElement('span'); msg.textContent = m.text;
        p.append(who, msg);
        $('chat').appendChild(p);
        $('chat').scrollTop = $('chat').scrollHeight;
      } else if (m.type === 'world') {
        log(m.text, 'gold');
      } else if (m.type === 'presence') {
        const box = $('online'); box.innerHTML = '';
        (m.players || []).forEach((n) => {
          const s = document.createElement('span'); s.className = 'pill'; s.textContent = n; box.appendChild(s);
        });
      }
    };
    ws.onclose = () => setTimeout(connect, 3000);
  }

  async function refreshBoard() {
    try {
      const d = await api('/api/rpg/c/leaderboard');
      $('board').innerHTML = (d.players || [])
        .map((p) => `<tr><td>${p.rank}. ${p.name}</td><td class="r">${p.realm}</td></tr>`).join('');
    } catch {}
  }

  $('enterBtn').addEventListener('click', enter);
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
  $('btnBreak').addEventListener('click', breakthrough);
  $('noticeOk').addEventListener('click', () => $('notice').classList.add('hidden'));
  $('chatSend').addEventListener('click', () => {
    const v = ($('chatInput').value || '').trim();
    if (!v || !S.ws || S.ws.readyState !== 1) return;
    S.ws.send(JSON.stringify({ type: 'chat', text: v }));
    $('chatInput').value = '';
  });
  $('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('chatSend').click(); });

  const saved = localStorage.getItem('cultivate.name');
  if (saved) $('nameInput').value = saved;
  setInterval(refreshBoard, 20000);
})();
</script>
</body>
</html>
