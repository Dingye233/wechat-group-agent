<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/rpg/manifest.json">
<link rel="apple-touch-icon" href="/rpg/icon-192.png">
<title>问道 · 修仙界</title>
<style>
  :root{ --gold:#e8c06a; --jade:#6ee7b7; --ink:#050b12; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--ink);color:#e9f2ee;overflow:hidden;
    font:14px/1.5 "Noto Serif SC","Songti SC",Georgia,"Microsoft YaHei",serif;user-select:none}
  #bar{position:fixed;left:0;right:0;top:0;height:44px;display:flex;align-items:center;gap:8px;
    padding:0 10px;background:#08131ded;border-bottom:1px solid #1d3a2e;z-index:10}
  #bar .brand{color:var(--gold);letter-spacing:3px;font-size:15px;margin-right:auto}
  #bar button{appearance:none;border:1px solid #2b5644;background:#10251c;color:#cfe6da;
    padding:7px 14px;border-radius:10px;font:inherit;font-size:13.5px;cursor:pointer}
  #bar button.on{background:linear-gradient(180deg,#2a6b4f,#1a4733);border-color:#3d8a66;color:#fff}
  #bar .ghost{background:transparent;color:#8fb3a6}
  #views{position:fixed;inset:44px 0 0 0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#050b12}
  .hidden{display:none}
  #tip{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);background:#0d1f18e6;border:1px solid #2b5644;
    color:#bfe6d5;padding:8px 14px;border-radius:12px;font-size:12.5px;z-index:20;display:none;max-width:92vw;text-align:center}
  @media (max-width:900px) and (orientation:portrait){ #tip{display:block} }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">问 道</span>
  <button data-view="action" class="on">动作闯关</button>
  <button data-view="text">文字修行</button>
  <button class="ghost" id="installBtn">装到桌面</button>
</div>
<div id="views">
  <iframe id="frame-action" data-src="/rpg/action" title="斩妖行"></iframe>
  <iframe id="frame-text" data-src="/rpg" title="文字修行" class="hidden"></iframe>
</div>
<div id="tip">📱 横过来玩更爽（也可以点右上「装到桌面」变成 App）</div>

<script>
(() => {
  const frames = { action: document.getElementById('frame-action'), text: document.getElementById('frame-text') };
  const buttons = [...document.querySelectorAll('#bar button[data-view]')];
  const tip = document.getElementById('tip');

  function show(view) {
    buttons.forEach((b) => b.classList.toggle('on', b.dataset.view === view));
    Object.entries(frames).forEach(([key, frame]) => {
      frame.classList.toggle('hidden', key !== view);
      if (key === view && !frame.getAttribute('src')) frame.setAttribute('src', frame.dataset.src);
    });
    localStorage.setItem('rpg.view', view);
    history.replaceState(null, '', '/rpg/play#' + view);
    setTimeout(() => { if (tip) tip.style.display = 'none'; }, 4000);
  }
  buttons.forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));
  show((location.hash || '').replace('#', '') === 'text' ? 'text' : (localStorage.getItem('rpg.view') || 'action'));

  // PWA 安装
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; });
  document.getElementById('installBtn').addEventListener('click', async () => {
    if (deferred) { deferred.prompt(); deferred = null; return; }
    alert('已经安装过啦，或者用浏览器菜单里的「添加到主屏幕」也行～');
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/rpg/sw.js').catch(() => {});
  }
  // 尝试锁定横屏（支持的话）
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch {}
})();
</script>
</body>
</html>
